name: Generate 3D Contributions

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC (06:00 PKT) — kept apart from the Metrics run to avoid conflicting pushes
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "chore(profile): update 3D contributions"; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
